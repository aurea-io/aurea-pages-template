services:
  aurea:
    build: .
    image: ${AUREA_IMAGE:-ghcr.io/aurea-io/aurea-pages-template}:${AUREA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUREA_PORT:-4173}:4173"
    environment:
      PORT: 4173
      AUREA_LOG_DIR: /app/logs
    volumes:
      - aurea-logs:/app/logs

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      aurea:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  aurea-logs:
  prometheus-data:
  grafana-data:
