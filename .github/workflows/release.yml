name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create tag and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="HEAD~1..HEAD"
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE_SHA}..${GITHUB_SHA}"
          fi
          scripts/release/validate-commits.sh "${range}"
      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/release/calculate-version.sh)
          if [[ -z "${version}" ]]; then
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "release=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "${tag}"
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
          gh workflow run docker-publish.yml --ref "${tag}" --field "version=${VERSION}"
