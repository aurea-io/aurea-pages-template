name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check and test
        run: npm run check && npm test

  frontend:
    name: Deploy frontend to Vercel
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static frontend
        run: |
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          npx --yes vercel@latest deploy apps/web --prod --yes --token "$VERCEL_TOKEN"

  backend:
    name: Deploy backend to Render
    needs: verify
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  notify-discord:
    name: Notify Discord
    if: always()
    needs: [verify, frontend, backend]
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
    steps:
      - name: Send deploy result to Discord
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'workflow dispatch' }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '—' }}
        run: |
          test -n "$DISCORD_BOT_TOKEN"
          test -n "$DISCORD_CHANNEL_ID"

          if [ "$VERIFY_RESULT" = "success" ] && [ "$FRONTEND_RESULT" = "success" ] && [ "$BACKEND_RESULT" = "success" ]; then
            status="✅ Deploy exitoso"
          else
            status="❌ Deploy fallido"
          fi

          commit_message="${COMMIT_MESSAGE%%$'\n'*}"
          commit_message="${commit_message//$'\r'/ }"
          content="$status en repo $GITHUB_REPOSITORY, commit ${GITHUB_SHA:0:7} ($commit_message), tag: $TAG_NAME"
          payload=$(jq -n --arg content "$content" '{content: $content}')

          curl --fail --silent --show-error \
            -X POST "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload"
