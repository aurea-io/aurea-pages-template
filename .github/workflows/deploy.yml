name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run check && npm test

  frontend:
    name: Deploy frontend to Vercel
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static frontend
        run: |
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest link apps/web --yes \
            --project "$VERCEL_PROJECT_ID" \
            --scope aurea-pages-template \
            --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy apps/web --prod --yes --token "$VERCEL_TOKEN"

  backend:
    name: Deploy backend to Render
    needs: verify
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
