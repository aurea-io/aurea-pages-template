name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  ci:
    uses: aurea-io/aurea-ci/.github/workflows/ci.yml@v1
    with:
      check-command: npm run check
      test-command: npm test
      docker-build: true
      release-script-test: true
  security:
    uses: aurea-io/aurea-ci/.github/workflows/security.yml@v1
  commit-policy:
    if: github.event_name == 'pull_request'
    uses: aurea-io/aurea-ci/.github/workflows/commit-policy.yml@v1
