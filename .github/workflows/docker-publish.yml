name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aurea-io/aurea-pages-template

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUREA_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-telegram:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram no configurado; se omite el aviso."
            exit 0
          fi
          message=$(printf 'Aurea publicada 🚀\nTag: %s\nCommit: %.7s' "${RELEASE_TAG}" "${GITHUB_SHA}")
          sent=0
          IFS='|' read -ra chat_ids <<< "${TELEGRAM_CHAT_ID}"
          for chat_id in "${chat_ids[@]}"; do
            chat_id="$(echo "${chat_id}" | xargs)"
            [[ -z "${chat_id}" ]] && continue
            curl --fail --silent --show-error --request POST \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${message}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
            sent=$((sent + 1))
          done
          if [[ "${sent}" -eq 0 ]]; then
            echo "TELEGRAM_CHAT_ID no contiene ningún chat válido." >&2
            exit 1
          fi
          echo "Telegram notificado en ${sent} chat(s)."

  notify-discord:
    name: Notify Discord
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord webhooks
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          message=$(printf 'Aurea publicada 🚀\nTag: %s\nCommit: %.7s' "${RELEASE_TAG}" "${GITHUB_SHA}")
          payload="$(printf '%s' "${message}" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')"
          sent=0
          if [[ -n "${DISCORD_BOT_TOKEN}" ]]; then
            if [[ -z "${DISCORD_CHANNEL_ID}" ]]; then
              echo "DISCORD_CHANNEL_ID es obligatorio cuando se usa DISCORD_BOT_TOKEN." >&2
              exit 1
            fi
            IFS='|' read -ra channel_ids <<< "${DISCORD_CHANNEL_ID}"
            for channel_id in "${channel_ids[@]}"; do
              channel_id="$(echo "${channel_id}" | xargs)"
              [[ -z "${channel_id}" ]] && continue
              curl --fail --silent --show-error --request POST \
                --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
                --header 'content-type: application/json' \
                --data "${payload}" \
                "https://discord.com/api/v10/channels/${channel_id}/messages"
              sent=$((sent + 1))
            done
          elif [[ -n "${DISCORD_WEBHOOK_URL}" ]]; then
            IFS='|' read -ra webhooks <<< "${DISCORD_WEBHOOK_URL}"
            for webhook in "${webhooks[@]}"; do
              webhook="$(echo "${webhook}" | xargs)"
              [[ -z "${webhook}" ]] && continue
              curl --fail --silent --show-error --request POST \
                --header 'content-type: application/json' \
                --data "${payload}" \
                "${webhook}"
              sent=$((sent + 1))
            done
          else
            echo "Discord no configurado; se omite el aviso."
            exit 0
          fi
          if [[ "${sent}" -eq 0 ]]; then
            echo "La configuración de Discord no contiene destinos válidos." >&2
            exit 1
          fi
          echo "Discord notificado en ${sent} destino(s)."
