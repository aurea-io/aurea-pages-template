name: Publish Docker image
on:
  release: { types: [published] }
  workflow_dispatch:
    inputs:
      version: { description: Version without the v prefix, required: true, type: string }
permissions:
  contents: read
  packages: write
jobs:
  publish:
    uses: aurea-io/aurea-ci/.github/workflows/docker-publish.yml@main
    with:
      image: ghcr.io/aurea-io/aurea-pages-template
      version: ${{ github.event.release.tag_name || inputs.version }}
    secrets: inherit
