name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aurea-io/aurea-pages-template

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUREA_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-telegram:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram no configurado; se omite el aviso."
            exit 0
          fi
          message=$(printf 'Aurea publicada 🚀\nTag: %s\nCommit: %.7s' "${RELEASE_TAG}" "${GITHUB_SHA}")
          sent=0
          IFS='|' read -ra chat_ids <<< "${TELEGRAM_CHAT_ID}"
          for chat_id in "${chat_ids[@]}"; do
            chat_id="$(echo "${chat_id}" | xargs)"
            [[ -z "${chat_id}" ]] && continue
            curl --fail --silent --show-error --request POST \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${message}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
            sent=$((sent + 1))
          done
          if [[ "${sent}" -eq 0 ]]; then
            echo "TELEGRAM_CHAT_ID no contiene ningún chat válido." >&2
            exit 1
          fi
          echo "Telegram notificado en ${sent} chat(s)."
